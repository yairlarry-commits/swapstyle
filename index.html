:root { color-scheme: light; }

body {
  margin: 0;
  font-family: Inter, Heebo, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;

  overscroll-behavior-y: none;
  text-rendering: optimizeLegibility;
}
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }

.pb-safe { padding-bottom: env(safe-area-inset-bottom); }
.h-safe-top { height: env(safe-area-inset-top); }
.skeleton {
  background: linear-gradient(90deg, #eeeef0 25%, #f7f7f8, #eeeef0 75%);
  background-size: 1000px 100%;
  animation: shimmer 1.6s linear infinite;
}
@keyframes shimmer { 0% { background-position: -1000px 0 } 100% { background-position: 1000px 0 } }

/* Right-to-left: arrows that point "forward/back" flip with the reading direction */
[dir='rtl'] .flip-rtl { transform: scaleX(-1); }

/* Hebrew has no capital letters: drop the wide letter-spacing used on small caps labels */
[dir='rtl'] [class*='tracking-'] { letter-spacing: normal !important; }
