<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#C9A24A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SwapStyle" />
    <meta name="application-name" content="SwapStyle" />
    <meta name="description" content="SwapStyle — swap clothes you no longer wear for something new. Zero cost, zero waste." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SwapStyle — Clothes Swapping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Heebo:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      html { background: #ffffff; }
      #ss-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #ffffff; z-index: 9999; transition: opacity .4s ease; }
      #ss-splash svg { animation: ss-pulse 1.8s ease-in-out infinite; }
      #ss-splash.gone { opacity: 0; pointer-events: none; }
      @keyframes ss-pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
    </style>
  </head>
  <body>
    <div id="ss-splash"><img src="/favicon.svg" width="56" height="56" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
